name: Deploy TategakiPrint by Blazor WASM to GitHub Pages

on:
  push:
    branches: [ "main" ] # メインブランチ名（main または master）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302' # 使用している .NET のバージョンに合わせて変更

      # base href をリポジトリ名（例: /tategaki/）に自動書き換え
      - name: Adjust base href for GitHub Pages
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          sed -i 's|<base href="/" />|<base href="/'"$REPO_NAME"'/" />|g' TategakiPrint/wwwroot/index.html

      # .NET アプリのビルドと公開
      - name: Publish .NET App
        run: dotnet publish TategakiPrint/TategakiPrint.csproj -c Release -o release

      # wwwroot 階層をフラットにしてルート直下に index.html を配置する
      - name: Flatten directory structure
        run: |
          cp -r release/wwwroot/* release/
          rm -rf release/wwwroot

      # 成果物フォルダのルートへ .nojekyll を配置する
      - name: Add .nojekyll to publish output
        run: touch release/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4